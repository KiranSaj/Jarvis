name: Bug report
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If this involves inappropriate content reaching a child, or anything
        else with a safety or security dimension, please report it privately
        instead — see
        [SECURITY.md](https://github.com/KiranSaj/Jarvis/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: said
    attributes:
      label: What was said to it
      description: The exact words, if the bug involves a voice command.
      placeholder: "Jarvis, open up"

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Android phone or tablet
        - Windows PC
        - iPhone or iPad
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 140 on Android 15"
    validations:
      required: true

  - type: dropdown
    id: served
    attributes:
      label: How was the app served
      description: Most failures here are secure-context rules, and these two paths differ.
      options:
        - "https:// over the LAN (Docker + Caddy)"
        - "http://localhost:8000 (start_the_server.bat)"
        - Other or not sure
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: AI source in Settings
      options:
        - Ollama on home PC
        - Anthropic API
        - OpenAI-compatible
        - Not relevant to this bug
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: >
        The app logs a lot on purpose — which command it matched, whether a
        reply was blocked, how long the model took. Paste anything relevant.
      render: text

  - type: checkboxes
    id: checked
    attributes:
      label: Before submitting
      options:
        - label: I ran `node check.mjs` and noted whether it passes
          required: false
